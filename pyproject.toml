[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "name-that-llm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "pyarrow", "scikit-learn>=1.6", "scipy"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 110
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
addopts = "-q"
